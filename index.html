    <script>
      function mostrarTelaVermelha(mensagem, detalhes) {
        var div = document.createElement("div");
        div.style.cssText =
          "position:fixed;top:0;left:0;z-index:999999;background:#990000;color:white;padding:20px;font-size:14px;width:100vw;min-height:100vh;word-wrap:break-word;overflow-y:auto;";
        div.innerHTML =
          "<b>Erro:</b> " +
          mensagem +
          "<br><br><b>Detalhes:</b> " +
          (detalhes || "N/A");

        var append = function () {
          document.body.appendChild(div);
        };
        if (document.body) append();
        else document.addEventListener("DOMContentLoaded", append);
      }

      window.onerror = function (msg, url, line, col, error) {
        mostrarTelaVermelha(msg, "Linha: " + line + " | Arquivo: " + url);
        return false; // permite que o erro vá pro console original
      };

      window.addEventListener("unhandledrejection", function (e) {
        mostrarTelaVermelha(
          "Promise Rejection",
          e.reason ? e.reason.message || e.reason : "Desconhecido",
        );
      });

      window.addEventListener(
        "error",
        function (e) {
          if (
            e.target &&
            (e.target.tagName === "SCRIPT" || e.target.tagName === "LINK")
          ) {
            mostrarTelaVermelha(
              "Falha ao baixar arquivo",
              e.target.src || e.target.href,
            );
          }
        },
        true,
      );
    </script>

    <!-- Meta Pixel Code -->
    <script>
      function initFacebookPixel() {
        if (window.fbqInitialized) return;
        window.fbqInitialized = true;
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(
          window,
          document,
          "script",
          "https://connect.facebook.net/en_US/fbevents.js",
        );
        fbq("init", "1094977616595175");
        fbq("track", "PageView");
      }

      // Adiar a inicialização até a interação real do usuário, evitando desperdício de cache TTL curto (20min) e economizando banda inicial
      const INTERACTION_EVENTS = ['mouseenter', 'mousedown', 'touchstart', 'scroll', 'keydown'];
      function loadPixelOnInteraction() {
        initFacebookPixel();
        INTERACTION_EVENTS.forEach(event => {
          window.removeEventListener(event, loadPixelOnInteraction);
        });
      }
      INTERACTION_EVENTS.forEach(event => {
        window.addEventListener(event, loadPixelOnInteraction, { passive: true });
      });
    </script>
