<!-- 1. Capturador de Erros Avançado (Pega falhas de módulos) -->
    <script>
      // Captura erros de Javascript padrão
      window.onerror = function (message, source, lineno, colno, error) {
        mostrarErro("JS Error: " + message + "\nLinha: " + lineno);
      };

      // Captura erros de Promises não tratadas
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason ? (event.reason.message || event.reason) : 'Desconhecido';
        mostrarErro("Promise Rejection: " + reason);
      });

      // NOVO: Captura falhas de carregamento de scripts/módulos (Muito comum no Safari)
      window.addEventListener('error', function(event) {
        if (event.target && (event.target.tagName === 'SCRIPT' || event.target.tagName === 'LINK')) {
          var file = event.target.src || event.target.href || 'desconhecido';
          mostrarErro("Falha ao carregar arquivo de rede: " + file + "\nO Safari pode ter bloqueado ou abortado o download.");
        }
      }, true); // O 'true' ativa a fase de captura, essencial para erros de tag DOM

      // Função auxiliar para exibir a tela vermelha
      function mostrarErro(mensagem) {
        alert(mensagem);
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;background:#990000;color:white;padding:20px;font-size:14px;width:100vw;min-height:100vh;word-wrap:break-word;';
        div.innerText = mensagem;
        
        if (document.body) {
          document.body.appendChild(div);
        } else {
          document.addEventListener("DOMContentLoaded", function() {
            document.body.appendChild(div);
          });
        }
      }
    </script>
