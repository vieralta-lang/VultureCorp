    <!-- 1. Capturador de Erros (Sempre no topo do head) -->
    <script>
      window.onerror = function (message, source, lineno, colno, error) {
        alert("Erro: " + message + "\nLinha: " + lineno);
        
        // Cria uma tela vermelha com o log
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;z-index:99999;background:#990000;color:white;padding:20px;font-size:14px;width:100vw;min-height:100vh;word-wrap:break-word;';
        div.innerText = "Error: " + message + "\n\nStack: " + (error ? error.stack : 'N/A');
        
        // Garante que anexa o div (funciona antes ou depois do body existir)
        if (document.body) {
          document.body.appendChild(div);
        } else {
          document.addEventListener("DOMContentLoaded", function() {
            document.body.appendChild(div);
          });
        }
      };

      // Captura erros assíncronos (falhas em requisições ou promises não tratadas)
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event.reason ? (event.reason.message || event.reason) : 'Desconhecido';
        alert("Promise Rejection: " + reason);
      });
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
