<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TNP Method — Consultoria fitness online." />
    <title>TNP Method | Consultoria Fitness</title>

    <script>
      function getTimestamp() {
        var d = new Date();
        return "[" + d.toTimeString().split(' ')[0] + "." + String(d.getMilliseconds()).padStart(3, '0') + "]";
      }

      function mostrarTelaVermelha(mensagem, detalhes) {
        console.error(getTimestamp() + " ERRO CAPTURADO:", mensagem, detalhes);
        var div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:0;left:0;z-index:999999;background:#990000;color:white;padding:20px;font-size:14px;width:100vw;min-height:100vh;word-wrap:break-word;overflow-y:auto;';
        div.innerHTML = "<b>Erro:</b> " + mensagem + "<br><br><b>Detalhes:</b> " + (detalhes || 'N/A');
        
        var append = function() { document.body.appendChild(div); };
        if (document.body) append();
        else document.addEventListener("DOMContentLoaded", append);
      }

      window.onerror = function (msg, url, line, col, error) {
        mostrarTelaVermelha(msg, "Linha: " + line + " | Arquivo: " + url);
        return false; // permite que o erro vá pro console original
      };

      window.addEventListener("unhandledrejection", function (e) {
        mostrarTelaVermelha("Promise Rejection", e.reason ? (e.reason.message || e.reason) : 'Desconhecido');
      });

      window.addEventListener('error', function(e) {
        if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          mostrarTelaVermelha("Falha ao baixar arquivo", e.target.src || e.target.href);
        }
      }, true);

      console.log(getTimestamp() + " [Etapa 1]: Scripts inline de monitoramento e global listeners inicializados.");
    </script>

    <!-- Eruda: Console móvel integrado para depuração no Safari/celulares -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      try {
        eruda.init();
        console.log("[" + new Date().toTimeString().split(' ')[0] + "." + String(new Date().getMilliseconds()).padStart(3, '0') + "] [Eruda]: Inicializado com sucesso!");
      } catch (e) {
        console.error("[Eruda]: Falha ao inicializar", e);
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      function getTimestamp() {
        var d = new Date();
        return "[" + d.toTimeString().split(' ')[0] + "." + String(d.getMilliseconds()).padStart(3, '0') + "]";
      }
      console.log(getTimestamp() + " [Etapa 2]: Body do HTML renderizando. Div #app declarada a seguir.");
    </script>
    <div id="app"></div>
    <script>
      console.log(getTimestamp() + " [Etapa 3]: Div #app presente no DOM. Módulo principal src/main.ts será carregado.");
    </script>
    
    <script type="module" src="/src/main.ts"></script>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        console.log(getTimestamp() + " [Etapa 4 - DOMContentLoaded]: DOM completamente carregada e analisada.");
        const appEl = document.getElementById('app');
        console.log("             " + getTimestamp() + " Estado atual da div #app no DOMContentLoaded:", appEl ? "Disponível (HTML: " + appEl.innerHTML + ")" : "NÃO disponível");
      });
      window.addEventListener('load', () => {
        console.log(getTimestamp() + " [Etapa 5 - Window Load]: Página e recursos externos totalmente carregados.");
      });
    </script>
  </body>
</html>
